<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리치 미니 · 한국어 문진</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><span class="badge">REACHY MINI</span><span id="connection" role="status">연결 중</span></header>
<section class="intro"><p class="eyebrow">가볍게 묻고, 다정하게 듣는</p><h1>안녕하세요,<br>리치 미니예요.</h1><p>세 가지 질문으로 시작해 볼까요?<br>문진 뒤에는 편하게 이야기를 나눠요.</p></section>
<section class="card" aria-labelledby="session-title"><div class="card-top"><h2 id="session-title">한국어 문진</h2><span id="phase">준비 중</span></div>
<ol id="steps"><li>불편한 곳</li><li>시작 시점</li><li>불편한 정도</li></ol>
<p id="question" class="question">연결을 확인하고 있어요.</p><p id="listening" aria-live="polite"></p>
<div class="actions"><button id="start" disabled>문진 시작</button><button id="stop" class="secondary" disabled>대화 종료</button></div>
<p id="error" role="alert"></p></section>
<section class="transcript"><h2>방금 나눈 이야기</h2><p id="last-message" aria-live="polite">로봇이 말을 마치면 짧게 대답해 주세요.</p></section>
<footer>문진 연습용이며 진단을 제공하지 않습니다.<br>음성 인식에는 Mac 도우미가 필요합니다. 답변 텍스트는 기존 음성 대화 서비스로 전달되며, 이 앱은 문진 기록을 파일로 저장하지 않습니다.</footer>
</main><script src="/static/main.js"></script></body></html>
